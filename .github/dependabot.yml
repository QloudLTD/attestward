version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init/autobuild/analyze must run the same action version or CodeQL
      # fails with "All steps must use the same version"; bump them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
