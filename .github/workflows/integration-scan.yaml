name: Integration scan (demo org)

# The API-drift tripwire (issue #15): runs `attestor scan` against the real
# public demo org and asserts every result against fixtures.yaml. Catches
# GitHub API changes that would silently invalidate a collector's
# assumptions before a user hits them.

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC — off-the-hour to avoid GitHub Actions' documented cron pile-up
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # only for the on-failure pinned-issue step below; never writes to the scanned demo org itself (ADR-0004: attestor never mutates a scanned target)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run integration test against the demo org
        env:
          GITHUB_TOKEN: ${{ secrets.DEMO_ORG_PAT }}
        run: |
          # A missing secret must fail this job loudly, not let the test's
          # own "skip cleanly without a token" behavior (correct for local
          # runs, where no token just means "don't run this test") make the
          # drift tripwire go green while never actually checking anything —
          # exactly the silently-invalidated-assumption failure mode this
          # workflow exists to catch, applied to itself.
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::DEMO_ORG_PAT secret is not set — see CONTRIBUTING.md's PAT provisioning section" >&2
            exit 1
          fi
          go test -tags integration ./cmd/attestor/... -run TestIntegration_DemoOrgMatchesFixtures -v

      - name: Open or update the drift-tripwire issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "Integration scan drift: demo org no longer matches fixtures.yaml";
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled integration scan against the demo org (issue #15) failed.\n\nThis usually means either a real regression in a collector, or GitHub's API behavior drifted out from under an assumption a collector makes.\n\nFailed run: ${runURL}\n\nClose this issue once the drift is understood and either the collector or \`fixtures.yaml\` is fixed to match.`;
            const label = "integration-drift";

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${runURL}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
