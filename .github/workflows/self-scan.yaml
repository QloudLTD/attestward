name: Self-scan

# Issue #32: the repo is the first case study. Runs attestward against
# sioakim/attestward itself and publishes the evidence pack as an artifact.
# Since issue #36 this workflow is also the first consumer (and the live
# end-to-end test) of the sioakim/attestward-action composite action: the
# scan runs the pinned, signature-verified *release* binary rather than a
# HEAD build (HEAD correctness is ci.yaml's job; this workflow validates
# the artifact users actually run), and every run diffs against the pack
# attached to the latest release — posture drift fails the run (ADR-0007).
#
# Token strategy: the ambient GITHUB_TOKEN, scoped read-only by the
# `permissions:` block below — not a fine-grained PAT. This is one of the
# two options issue #32's own text anticipates ("org-level checks scoped
# to what a repo-level GITHUB_TOKEN/fine-grained PAT can see"). The
# tradeoff: GITHUB_TOKEN has no "Administration" permission category at
# all (not grantable via `permissions:`, unlike a fine-grained PAT), so
# checks needing admin-level repo reads (parts of C02/C04/C08) will likely
# show not-checkable here even where they'd resolve with a broader token —
# an honest degradation, not a bug (not-checkable never fails the exit
# code below). Upgrading to a dedicated fine-grained PAT for deeper
# coverage is a deliberate future enhancement, not done here: creating and
# storing a new credential is a more consequential step than this
# workflow's own read-only scope, left for the repo owner's own call.
on:
  release:
    types: [published]
  schedule:
    # Monday 06:00 UTC — arbitrary but fixed, so drift is visible weekly
    # even between releases.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: self-scan
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  self-scan:
    runs-on: [self-hosted, macOS]
    steps:
      # Default clean:true is quietly load-bearing on this self-hosted
      # runner: it wipes any evidence/ left behind by a prior run, so a
      # catastrophically-failed scan step can't have the evaluate step
      # below accidentally read stale evidence.json from a previous run
      # and pass against it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Drift baseline: the evidence.json attached to the latest release
      # (durable, unlike expiring workflow artifacts — see the
      # attach-to-release job below, which maintains it). A missing asset
      # is expected, not an error: it just means no baseline yet (first
      # run after this workflow landed, or no release-triggered run has
      # attached one), and the action skips drift mode on an empty
      # baseline input.
      - name: Fetch drift baseline from the latest release
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download --repo "$GITHUB_REPOSITORY" \
               --pattern evidence.json --dir baseline 2>/dev/null; then
            echo "path=baseline/evidence.json" >> "$GITHUB_OUTPUT"
            echo "baseline: latest release's evidence.json"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no evidence.json on the latest release — drift detection skipped this run"
          fi

      - uses: sioakim/attestward-action@45e3861d57f503a2b7362253d4c924de3158ed87 # v1.0.0
        id: attestward
        with:
          version: "0.2.0"
          org: sioakim
          repos: attestward
          self-attestation-file: self-attestation.yaml
          out: evidence
          baseline: ${{ steps.baseline.outputs.path }}
          # Posture drift against the last release's pack fails the run —
          # that's the alarm this workflow exists to ring (#36). Gaps
          # per se don't (fail-on-gaps default false): the evaluate step
          # below holds the sharper line, a documented exception list.
          fail-on-drift: "true"

      # The exception list below is the "deliberate, documented exception
      # list" issue #32 asks for, rather than letting exit 2 fail every
      # run indefinitely for known, currently-unfixable gaps. It's
      # deliberately narrow (individual check IDs, not whole collectors)
      # since attestward scan's own --check flag only scopes at collector
      # granularity and several of these collectors have other checks that
      # DO pass — excluding a whole collector would hide real, currently
      # -passing coverage, not just the known gap.
      #
      # Every entry here must cite why it's here and where the real fix
      # (not the exception) is tracked:
      #   - C06.sca.dependency-review: GHAS-gated on a private repo (same
      #     as DECISIONS.md D7's CodeQL entry) — resolves when this repo
      #     goes public or GHAS is purchased, not before.
      #   - C02.branch.admin-enforced: real, accepted gap — an Admin-role
      #     "always" bypass actor is deliberately kept on the main ruleset
      #     so this solo-maintainer repo can still merge without a second
      #     reviewer who doesn't exist; C02.branch.required-reviews itself
      #     was fixed (required_approving_review_count raised to 1) and no
      #     longer needs this exception. See DECISIONS.md D10, issue #105.
      #   - C09.repo.webhooks: needs a real receiving endpoint that
      #     doesn't exist yet — accepted and documented via a self-attested
      #     "no" for SA.audit-log-export-fallback instead (see
      #     self-attestation.yaml, DECISIONS.md D11, issue #106).
      #   - C05.sast.ran-per-release: semgrep landed (#157); the exception
      #     remains only until every release in the lookback window
      #     postdates it — same rolling-window logic as the tags-signed
      #     entry below.
      #   - C07.release.tags-signed: v0.1.0/v0.2.0 tags are annotated but
      #     unsigned; the key-identity decision is RESOLVED (DECISIONS.md
      #     D12, issue #158) and tags are signed from v0.3.0 onward — this
      #     entry outlives the fix until every tag in the 5-release/
      #     12-month window is signed, then it comes off the list.
      - name: Evaluate gaps against the documented exception list
        if: always()
        run: |
          set -euo pipefail
          test -f evidence/evidence.json || { echo "::error::no evidence.json was written — the scan itself failed; see the action step above"; exit 1; }
          allowed='["C06.sca.dependency-review","C02.branch.admin-enforced","C09.repo.webhooks","C05.sast.ran-per-release","C07.release.tags-signed"]'
          unexpected=$(jq --argjson allowed "$allowed" '
            [.results[] | select(.status == "verified-fail" or .status == "partial") | select(.check_id as $id | $allowed | index($id) | not)]
          ' evidence/evidence.json)
          count=$(jq 'length' <<<"$unexpected")
          if [ "$count" -gt 0 ]; then
            echo "::error::$count check(s) failed outside the documented exception list:"
            jq -r '.[] | "  - \(.check_id): \(.status) — \(.reason)"' <<<"$unexpected"
            exit 1
          fi

          # A green run with zero verified-fail/partial results is NOT the
          # same claim as "every check actually ran and passed" — every
          # collector error degrades to not-checkable (never a false
          # verified-fail), so a broken token, an API outage, or a runner
          # misconfiguration could silently turn every single check
          # not-checkable and still reach this line with nothing to
          # complain about. For an unattended weekly cron, that's a green
          # badge that verified nothing — worse than a red one, since
          # nobody's watching to notice (found in code review of PR #108).
          # This floor doesn't assert a specific expected count (this
          # workflow's own GITHUB_TOKEN has narrower reach than the
          # broader token this workflow was developed against, so the
          # real pass count isn't pinned down yet) — it only catches the
          # total-collapse case.
          pass_count=$(jq '[.results[] | select(.status == "verified-pass")] | length' evidence/evidence.json)
          if [ "$pass_count" -eq 0 ]; then
            echo "::error::zero verified-pass results in this scan — every check is either not-checkable, self-attested, or on the exception list. That's not the same as 'no gaps' and likely means something (token, API access, a broken build) failed silently rather than a genuinely clean posture."
            exit 1
          fi

          echo "no undocumented gaps — every verified-fail/partial result (if any) is on the documented exception list, and $pass_count check(s) genuinely verified-pass"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: self-scan-evidence
          path: evidence/
          # Explicit, not the repo default: this artifact is small
          # (a JSON pack + one HTML file) and is meant to be inspectable
          # for a reasonable stretch between releases, not indefinitely.
          retention-days: 90

  # The one write in this workflow, isolated in its own job so the scan
  # job's permissions stay read-only (ADR-0007): on release events, the
  # fresh pack becomes the new drift baseline by being attached to the
  # triggering release.
  attach-to-release:
    if: github.event_name == 'release'
    needs: self-scan
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: self-scan-evidence
          path: evidence
      - name: Attach pack to the triggering release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            evidence/evidence.json evidence/report.html
