name: Self-scan

# Issue #32: the repo is the first case study. Runs attestward against
# sioakim/attestward itself and publishes the evidence pack as an artifact.
# Since issue #36 this workflow is also the first consumer (and the live
# end-to-end test) of the sioakim/attestward-action composite action: the
# scan runs the pinned, signature-verified *release* binary rather than a
# HEAD build (HEAD correctness is ci.yaml's job; this workflow validates
# the artifact users actually run), and every run diffs against the pack
# attached to the latest release — posture drift fails the run (ADR-0007).
#
# Token strategy: the ambient GITHUB_TOKEN, scoped read-only by the
# `permissions:` block below — not a fine-grained PAT. This is one of the
# two options issue #32's own text anticipates ("org-level checks scoped
# to what a repo-level GITHUB_TOKEN/fine-grained PAT can see"). The
# tradeoff: GITHUB_TOKEN has no "Administration" permission category at
# all (not grantable via `permissions:`, unlike a fine-grained PAT), so
# checks needing admin-level repo reads (parts of C02/C04/C08) will likely
# show not-checkable here even where they'd resolve with a broader token —
# an honest degradation, not a bug (not-checkable never fails the exit
# code below). Upgrading to a dedicated fine-grained PAT for deeper
# coverage is a deliberate future enhancement, not done here: creating and
# storing a new credential is a more consequential step than this
# workflow's own read-only scope, left for the repo owner's own call.
# Issue #211: `on: release: types: [published]` never actually fires here.
# release.yaml's goreleaser job creates every release using the ambient
# `secrets.GITHUB_TOKEN` (not a PAT or a human's own session) — and GitHub
# deliberately does not cascade events triggered by GITHUB_TOKEN into new
# workflow runs, to prevent recursive workflow chains (documented
# exceptions: workflow_dispatch, repository_dispatch, and pull_request
# opened/synchronize/reopened — release is not among them). Confirmed
# against this repo's own history, not assumed: `gh run list
# --workflow=self-scan.yaml` shows zero runs with event "release" ever,
# across all three real releases (v0.1.0, v0.2.0, v0.3.0) — every
# release-adjacent run visible there was a manual workflow_dispatch.
#
# `workflow_run` sidesteps the restriction: it fires on a workflow run's
# *completion*, regardless of what token authenticated the run underneath
# it — a documented, standard way to react to a GITHUB_TOKEN-authenticated
# workflow's results. release.yaml only ever runs on a `v*` tag push, so
# its completion is an unambiguous release signal; on success, its
# `head_branch` is the tag itself (verified against this repo's own past
# "Release" runs via `gh run list --workflow=release.yaml`, e.g. head
# branch "v0.3.0" for the run that published that tag) — see
# attach-to-release's TAG below.
#
# One tradeoff worth naming: unlike `on: release`, a `workflow_run`-
# triggered checkout resolves main's current HEAD, not the tagged commit
# (GITHUB_SHA here is the default branch, not the tag) — so
# self-attestation.yaml and anything else this scan reads comes from
# main, not from the exact commit the release was cut at. Anything merged
# between the tag push and the Release workflow's completion (usually
# seconds to minutes) lands in that release's pack. Mostly benign for
# this repo's cadence, but a real difference from what `on: release`
# would have given.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  schedule:
    # Monday 06:00 UTC — arbitrary but fixed, so drift is visible weekly
    # even between releases.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: self-scan
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  # A workflow_run event fires on every "Release" completion, including a
  # failed or cancelled one (e.g. the goreleaser job errors before
  # publishing) — there's no fresh release to scan against in that case, so
  # this run is a no-op rather than a scan that would just repeat the last
  # scheduled/dispatched one. schedule/workflow_dispatch are unaffected
  # (short-circuits on the event_name check).
  self-scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS]
    steps:
      # Default clean:true is quietly load-bearing on this self-hosted
      # runner: it wipes any evidence/ left behind by a prior run, so a
      # catastrophically-failed scan step can't have the evaluate step
      # below accidentally read stale evidence.json from a previous run
      # and pass against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Drift baseline: the evidence.json attached to the latest release
      # (durable, unlike expiring workflow artifacts — see the
      # attach-to-release job below, which maintains it). Logic lives in
      # hack/fetch-drift-baseline.sh, not inline here, specifically so it's
      # testable against a mocked `gh` without a real release — see
      # fetch-drift-baseline_test.sh (issue #211) — and because that
      # script's own header documents the cases (no release yet / latest
      # has it / latest is missing it — expected on the release currently
      # being processed, or a genuinely broken chain otherwise) this
      # comment used to have to.
      #
      # TRIGGER_TAG is set only on a workflow_run event, to the release
      # that triggered this run — this job always runs BEFORE
      # attach-to-release attaches that same release's own pack below, so
      # on every successful release run this script would otherwise see
      # the just-published release missing evidence.json and (correctly,
      # by every other signal) read that as a broken chain. TRIGGER_TAG
      # lets it recognize this one expected case instead.
      - name: Fetch drift baseline from the latest release
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: hack/fetch-drift-baseline.sh

      - uses: sioakim/attestward-action@45e3861d57f503a2b7362253d4c924de3158ed87 # v1.0.0
        id: attestward
        with:
          version: "0.2.0"
          org: sioakim
          repos: attestward
          self-attestation-file: self-attestation.yaml
          out: evidence
          baseline: ${{ steps.baseline.outputs.path }}
          # Posture drift against the last release's pack fails the run —
          # that's the alarm this workflow exists to ring (#36). Gaps
          # per se don't (fail-on-gaps default false): the evaluate step
          # below holds the sharper line, a documented exception list.
          fail-on-drift: "true"

      # The exception list below is the "deliberate, documented exception
      # list" issue #32 asks for, rather than letting exit 2 fail every
      # run indefinitely for known, currently-unfixable gaps. It's
      # deliberately narrow (individual check IDs, not whole collectors)
      # since attestward scan's own --check flag only scopes at collector
      # granularity and several of these collectors have other checks that
      # DO pass — excluding a whole collector would hide real, currently
      # -passing coverage, not just the known gap.
      #
      # Every entry here must cite why it's here and where the real fix
      # (not the exception) is tracked:
      #   - C06.sca.dependency-review: GHAS-gated on a private repo (same
      #     as DECISIONS.md D7's CodeQL entry) — resolves when this repo
      #     goes public or GHAS is purchased, not before.
      #   - C02.branch.admin-enforced: real, accepted gap — an Admin-role
      #     "always" bypass actor is deliberately kept on the main ruleset
      #     so this solo-maintainer repo can still merge without a second
      #     reviewer who doesn't exist; C02.branch.required-reviews itself
      #     was fixed (required_approving_review_count raised to 1) and no
      #     longer needs this exception. See DECISIONS.md D10, issue #105.
      #   - C09.repo.webhooks: needs a real receiving endpoint that
      #     doesn't exist yet — accepted and documented via a self-attested
      #     "no" for SA.audit-log-export-fallback instead (see
      #     self-attestation.yaml, DECISIONS.md D11, issue #106).
      #   - C05.sast.ran-per-release: semgrep landed (#157); the exception
      #     remains only until every release in the lookback window
      #     postdates it — same rolling-window logic as the tags-signed
      #     entry below.
      #   - C07.release.tags-signed: v0.1.0/v0.2.0 tags are annotated but
      #     unsigned; the key-identity decision is RESOLVED (DECISIONS.md
      #     D12, issue #158) and tags are signed from v0.3.0 onward — this
      #     entry outlives the fix until every tag in the 5-release/
      #     12-month window is signed, then it comes off the list.
      - name: Evaluate gaps against the documented exception list
        if: always()
        run: |
          set -euo pipefail
          test -f evidence/evidence.json || { echo "::error::no evidence.json was written — the scan itself failed; see the action step above"; exit 1; }
          allowed='["C06.sca.dependency-review","C02.branch.admin-enforced","C09.repo.webhooks","C05.sast.ran-per-release","C07.release.tags-signed"]'
          unexpected=$(jq --argjson allowed "$allowed" '
            [.results[] | select(.status == "verified-fail" or .status == "partial") | select(.check_id as $id | $allowed | index($id) | not)]
          ' evidence/evidence.json)
          count=$(jq 'length' <<<"$unexpected")
          if [ "$count" -gt 0 ]; then
            echo "::error::$count check(s) failed outside the documented exception list:"
            jq -r '.[] | "  - \(.check_id): \(.status) — \(.reason)"' <<<"$unexpected"
            exit 1
          fi

          # A green run with zero verified-fail/partial results is NOT the
          # same claim as "every check actually ran and passed" — every
          # collector error degrades to not-checkable (never a false
          # verified-fail), so a broken token, an API outage, or a runner
          # misconfiguration could silently turn every single check
          # not-checkable and still reach this line with nothing to
          # complain about. For an unattended weekly cron, that's a green
          # badge that verified nothing — worse than a red one, since
          # nobody's watching to notice (found in code review of PR #108).
          # This floor doesn't assert a specific expected count (this
          # workflow's own GITHUB_TOKEN has narrower reach than the
          # broader token this workflow was developed against, so the
          # real pass count isn't pinned down yet) — it only catches the
          # total-collapse case.
          pass_count=$(jq '[.results[] | select(.status == "verified-pass")] | length' evidence/evidence.json)
          if [ "$pass_count" -eq 0 ]; then
            echo "::error::zero verified-pass results in this scan — every check is either not-checkable, self-attested, or on the exception list. That's not the same as 'no gaps' and likely means something (token, API access, a broken build) failed silently rather than a genuinely clean posture."
            exit 1
          fi

          echo "no undocumented gaps — every verified-fail/partial result (if any) is on the documented exception list, and $pass_count check(s) genuinely verified-pass"

      # THIS ARTIFACT IS THE DRIFT BASELINE'S SOLE SOURCE. Do not delete this
      # step or shorten its retention without reading the chain: attach-to-release
      # (below) downloads it on release events and attaches evidence.json to the
      # release, and the drift check at the top of this job fetches the baseline
      # from exactly that release asset (via hack/fetch-drift-baseline.sh, #211).
      #
      # #211 shipped making a missing baseline distinguishable from a genuine
      # first run rather than failing open unconditionally — but breaking THIS
      # upload can still produce a silent, green skip in one specific case: if
      # no release has ever carried evidence.json (this step is what would
      # have seeded the very first one), the read side correctly reads that as
      # a genuine first run and stays green, since there is nothing yet to
      # compare against — unavoidable, not a bug. If an OLDER release still
      # carries a pack from before this step broke, the read side catches the
      # gap instead — loudly (a `::error::` broken-chain annotation), not
      # silently, and falls back to that older pack. Drift itself is enforced
      # by the action's fail-on-drift above, not by the gap-check step — but a
      # lost baseline is the same class of failure the pass_count floor below
      # exists to catch: a green run that verified less than it appears to.
      #
      # continue-on-error is still right, with an honest scope. On schedule and
      # workflow_dispatch runs — the large majority — attach-to-release is
      # skipped by its own `if:`, nothing consumes the artifact, and this stops a
      # storage-quota failure from reddening a badge-visible run whose scan
      # actually succeeded. On RELEASE runs it does not save the badge: the
      # download in attach-to-release fails instead and the run still goes red.
      # It fails loudly in the one case where the artifact genuinely matters,
      # which is the correct trade, not an oversight.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-evidence
        if: always()
        continue-on-error: true
        with:
          name: self-scan-evidence
          path: evidence/
          # 7 days, down from 90, matching ci.yaml for consistency. Be honest
          # about the size of that win: this is a JSON pack plus one HTML file,
          # zipped, so 90->7 frees on the order of ~5 MB of standing storage.
          # The real pressure was ci.yaml's attestward-builds — see below. This
          # change is right because two artifacts with the same lifetime are
          # easier to reason about, not because it materially eased the quota.
          #
          # #217: the quota exhausted outright — 10.82 GB across 1362
          # artifacts, 5.69 GB of it pre-rename `attestor-*` debris no
          # workflow references any more (deleted), the rest almost
          # entirely ci.yaml's attestward-builds. That upload now only
          # runs on pushes to main, not every PR/PR-push, which was the
          # actual volume driver — see its own comment in ci.yaml.
          retention-days: 7
      # #217: continue-on-error above is right (see this step's own
      # comment) but made the quota exhausting outright completely
      # invisible until a live dry run for #211 tripped over it by
      # accident — this is the second, independent layer that broke
      # (self-scan succeeds, upload fails, attach-to-release below has
      # nothing to download), the same silent-fail-open shape #211's own
      # fix exists to catch, arrived at from a different direction.
      # outcome reflects the step's real result before continue-on-error
      # masks it for the job's own conclusion — this only fires on a
      # genuine failure, and a `::warning::` never reddens the job.
      - name: Warn if the evidence-pack upload failed
        if: always() && steps.upload-evidence.outcome == 'failure'
        run: |
          echo "::warning::upload of self-scan-evidence failed — likely the artifact storage quota (issue #217); the scan itself succeeded, but attach-to-release below will have nothing to attach"

  # The one write in this workflow, isolated in its own job so the scan
  # job's permissions stay read-only (ADR-0007): when this run was fired by
  # a successful "Release" completion, the fresh pack becomes the new
  # drift baseline by being attached to the release that run just
  # published. TAG comes from the completed run's head_branch — for a
  # tag-triggered workflow that's the tag itself (see the workflow_run
  # trigger's own comment above for how that was verified against this
  # repo's real run history, not assumed).
  attach-to-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: self-scan
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: self-scan-evidence
          path: evidence
      - name: Attach pack to the release the triggering run just published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            evidence/evidence.json evidence/report.html
