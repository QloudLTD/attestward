name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Self-hosted per the same rule as ci.yaml/integration-scan.yaml (see
  # their matching comments): pure cross-compiled Go, no docker/nfpm
  # stanzas in .goreleaser.yaml, so no OS-specific build requirement. This
  # one matters more than most — a GitHub-hosted goreleaser job means a
  # `v*` tag push produces *no release at all* while Actions billing is
  # blocked, silently, unless someone happens to check the run.
  goreleaser:
    runs-on: [self-hosted, macOS]
    # A hung release job now blocks whichever of the six shared self-hosted
    # runner registrations it lands on (issue #313) — down from blocking the
    # one shared registration this repo used to have, but still a real cost,
    # unlike on a hosted runner where it only wasted its own VM —
    # integration-scan.yaml's jobs already set a timeout for the same
    # reason.
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # ambient OIDC token for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the conventional-commit changelog
      # cache: false — see ci.yaml's matching comment (issue #313): this
      # runner is self-hosted, so GOMODCACHE/GOCACHE already persist in
      # $HOME across jobs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Pin the actual cosign release, not just the installer action: the
      # bundle-based sign/verify flow in .goreleaser.yaml and SECURITY.md
      # was verified against this exact version.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.1"
      # No `version:` pin here — the action's own default (~> v2) matches
      # this repo's `.goreleaser.yaml` `version: 2` config schema; `latest`
      # would opt the release path into a future goreleaser v3 with
      # breaking config semantics, floating past the SHA-pinned action.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
