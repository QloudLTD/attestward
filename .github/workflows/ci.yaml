name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# lint/test/build/goreleaser-dry-run all run on the self-hosted Mac mini
# (spyros-mac-mini-ssdf) rather than a GitHub-hosted runner — cross-compilation
# (see `build`'s own comment below) means none of them need a specific OS to
# produce or check a binary, so there's no technical reason to spend
# GitHub-hosted Actions minutes running plain Go tooling. One runner queues
# these serially rather than in parallel, which is an acceptable tradeoff.
jobs:
  lint:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately NOT go-version-file: golangci-lint v2.12.2 requires Go
      # >=1.25, independent of go.mod's `go 1.22` minimum-compatibility
      # floor (the module itself doesn't need a newer language version —
      # only the linter tool being installed does).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: Install golangci-lint (pinned to the version required locally)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run

  # The required check — macOS, self-hosted (see the self-hosted comment
  # above).
  test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -race -coverprofile=coverage.out
      # Coverage is archival — nothing downstream consumes it — so its upload
      # must never fail a build whose tests passed. GitHub's artifact-storage
      # quota (recalculated every 6-12h) reddened green runs on PRs #202/#203:
      # every Go test passed, the upload hit the quota, and the job reported
      # failure. A red tick that doesn't mean "the code is wrong" is worse than
      # no tick, because it trains people to merge through red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Issue #83: restores the Linux-specific test coverage `test` above can't
  # provide on its own — case-sensitive filesystem, path/rename semantics,
  # the race-detector runtime — for a tool whose primary deployment target
  # is Linux CI. Runs on spyros-ionos-ssdf (self-hosted, amd64) rather than
  # falling back to a GitHub-hosted ubuntu-latest runner (issue #83's other
  # proposed option) — this repo already had a self-hosted Linux amd64
  # machine, it just wasn't running the test suite on it yet. `build` no
  # longer has a linux/amd64 leg of its own to share this machine with (it
  # cross-compiles everything from spyros-mac-mini-ssdf now), so this is the
  # only job that still touches spyros-ionos-ssdf. Deliberately NOT added to
  # this repo's required-checks list (a new job is non-required by default
  # unless explicitly added there): if this specific runner ever goes
  # offline, that must never be able to block a merge the way a required
  # check would, matching the same reasoning that keeps `build` non-required.
  test-linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -race -coverprofile=coverage.out

  # Issue #30's drift guard: docs/checks-reference.md is generated from
  # mappings/*.yaml + the collector registry (never hand-edited — see the
  # file's own header). A PR that changes either without regenerating fails
  # here rather than letting the reference silently go stale.
  checks-docs-drift:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make checks-docs-check

  # Cross-compiles every target platform from spyros-mac-mini-ssdf in one job,
  # instead of round-tripping through 4 different self-hosted runners
  # (previously: ionos for linux/amd64, parallels for linux/arm64, mac-mini
  # for both darwin arches, plus a wake/sleep cycle on the physical AORUS box
  # for windows/amd64 — several minutes of pure machine-management overhead
  # on top of the actual build, every single run). Go's own GOOS/GOARCH
  # cross-compilation makes native per-arch runners unnecessary for a
  # CGO_ENABLED=0 pure-Go binary — this is exactly what goreleaser-dry-run
  # below already does, and a local `goreleaser release --snapshot`
  # cross-compiled all 5 targets from one machine in 12 seconds during
  # PR #128's own verification. Only the output matching this runner's own
  # OS/arch (darwin/arm64) gets an execution check; the other 4 are
  # compile-checked, not run — cross-compiling doesn't buy execution
  # verification on the target OS, only compilation.
  #
  # This is now the required build path. The previous 4-runner, per-arch
  # native-build pattern (including the AORUS wake/sleep dance) is kept as a
  # reference in multi-arch-build-sample.yaml — non-required,
  # workflow_dispatch-only, for anyone who genuinely needs execution-verified
  # native builds again (e.g. a future CGO dependency that can't
  # cross-compile).
  build:
    needs: [lint, test]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-compile every target platform
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            out="attestward-${goos}-${goarch}${ext}"
            echo "building $out"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-X main.version=${{ github.sha }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "$out" ./cmd/attestward
          done
      - name: Verify the darwin/arm64 build runs (matches this runner's own arch)
        run: ./attestward-darwin-arm64 version
      # Same reasoning as the coverage upload above: these binaries are
      # archival convenience, and the build itself has already proven it
      # compiles and runs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: attestward-builds
          path: attestward-*
          retention-days: 7

  # Catches .goreleaser.yaml drift/breakage on every PR without needing a tag
  # push or cosign's OIDC signing context. Informational only (not a required
  # check) since it duplicates build's compile coverage.
  goreleaser-dry-run:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No `version:` pin — see the matching comment in release.yaml.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          args: release --snapshot --clean --skip=sign
