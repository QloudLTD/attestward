name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# lint/test/goreleaser-dry-run all run on the self-hosted Mac mini
# (spyros-mac-mini-ssdf) rather than a GitHub-hosted runner: none of them
# need a specific OS to execute a native binary (see `build`'s matrix below
# for the jobs that genuinely do), so there's no technical reason to spend
# GitHub-hosted Actions minutes running plain Go tooling. One runner queues
# these serially rather than in parallel, which is an acceptable tradeoff.
jobs:
  lint:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Deliberately NOT go-version-file: golangci-lint v2.12.2 requires Go
      # >=1.25, independent of go.mod's `go 1.22` minimum-compatibility
      # floor (the module itself doesn't need a newer language version —
      # only the linter tool being installed does).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Install golangci-lint (pinned to the version required locally)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run

  # macOS-only for now (see the self-hosted comment above): a real, if
  # low-risk, loss of Linux-specific test coverage for a tool whose primary
  # deployment target is Linux CI — tracked in #83, restore a non-required
  # ubuntu-latest leg here once GitHub Actions billing is unblocked.
  test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test ./... -race -coverprofile=coverage.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  # Issue #30's drift guard: docs/checks-reference.md is generated from
  # mappings/*.yaml + the collector registry (never hand-edited — see the
  # file's own header). A PR that changes either without regenerating fails
  # here rather than letting the reference silently go stale.
  checks-docs-drift:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make checks-docs-check

  # One matrix entry per Phase 0 target platform/arch, each on a runner that
  # can execute the binary natively (no cross-arch execution gaps) so this
  # job proves `attestor version` actually runs on linux, macOS, and windows —
  # not just that it compiles.
  build:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/amd64 runs on the self-hosted Ubuntu VM (spyros-ionos-ssdf,
          # x86_64, an IONOS-hosted Proxmox guest — always-on, unlike the
          # power-cycled local machines) rather than ubuntu-latest — same hard
          # rule as everything else in this repo's CI. linux/arm64 stays
          # GitHub-hosted: this runner can't natively execute an arm64 binary
          # (no Rosetta-style fallback on Linux without adding a qemu
          # dependency), so cross-arch execution genuinely isn't possible
          # here.
          - goos: linux
            goarch: amd64
            os: [self-hosted, Linux, X64]
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm
          # Both darwin builds run on the self-hosted Apple Silicon runner
          # (spyros-mac-mini-ssdf): amd64 executes fine there too since it
          # has Rosetta 2 installed, and self-hosted avoids GitHub-hosted
          # macOS runners' 10x included-minutes multiplier. Not a required
          # status check (see `lint`/`test` above), so this job is a no-op
          # rather than a blocker if the runner is ever offline.
          - goos: darwin
            goarch: amd64
            os: [self-hosted, macOS]
          - goos: darwin
            goarch: arm64
            os: [self-hosted, macOS]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="attestor-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-X main.version=${{ github.sha }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "$out" ./cmd/attestor
          echo "BIN=$out" >> "$GITHUB_ENV"
      - name: Verify it runs
        shell: bash
        run: ./"$BIN" version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: attestor-${{ matrix.goos }}-${{ matrix.goarch }}*

  # windows/amd64's native-execution leg runs on a physical self-hosted runner
  # (spyros-aorus-ssdf) that's kept powered off between uses (~300W draw) —
  # three sequenced jobs instead of one matrix entry: wake it, build+verify on
  # it, power it back off. Not a required status check (see `lint`/`test`
  # above), same as build's other legs.
  wake-aorus:
    needs: [lint, test]
    runs-on: [self-hosted, macOS]
    concurrency:
      group: aorus-windows-runner
      cancel-in-progress: false
    outputs:
      cold_woke: ${{ steps.wake.outputs.cold_woke }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Wake AORUS
        id: wake
        run: |
          output=$(tools/aorus.sh on)
          echo "$output"
          cold_woke=$(echo "$output" | grep -o 'COLD_WOKE=.*' | cut -d= -f2)
          echo "cold_woke=$cold_woke" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [wake-aorus]
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: aorus-windows-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # This runner also has WSL's bash.exe launcher stub on PATH (no
      # installed distribution), and GitHub's `shell: bash` resolution
      # picked that one over Git for Windows' real bash — confirmed
      # directly in a real CI run ("Windows Subsystem for Linux has no
      # installed distributions"). Pointing `shell:` at Git's bash.exe by
      # full path doesn't work either — the runner's own internal
      # path-combining logic throws ("Second path fragment must not be a
      # drive or UNC name") when the shell command starts with a drive
      # letter, also confirmed directly. Prepending Git's bin directory to
      # PATH via GITHUB_PATH instead — the documented, supported way to
      # influence which binary a later `shell: bash` step resolves to.
      - name: Prefer Git's bash over the WSL launcher stub
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-X main.version=${{ github.sha }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o attestor-windows-amd64.exe ./cmd/attestor
      - name: Verify it runs
        shell: bash
        run: ./attestor-windows-amd64.exe version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestor-windows-amd64
          path: attestor-windows-amd64.exe

  # Runs regardless of build-windows's outcome (if: always()) — a failed
  # Windows build must not leave the box powered on indefinitely. Only
  # actually shuts down if wake-aorus cold-woke it: if AORUS was already up
  # when this run started, something else is using it, and powering it off
  # out from under that isn't this pipeline's call to make (see
  # tools/aorus.sh's own doc comment).
  sleep-aorus:
    needs: [wake-aorus, build-windows]
    if: always()
    runs-on: [self-hosted, macOS]
    concurrency:
      group: aorus-windows-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Power off AORUS
        if: needs.wake-aorus.outputs.cold_woke == 'true'
        run: tools/aorus.sh off
      - name: Leave AORUS running (was already up before this run)
        if: needs.wake-aorus.outputs.cold_woke != 'true'
        run: echo "AORUS was already up when wake-aorus ran — leaving it as-is"

  # Catches .goreleaser.yaml drift/breakage on every PR without needing a tag
  # push or cosign's OIDC signing context. Informational only (not a required
  # check) since it duplicates build's compile coverage.
  goreleaser-dry-run:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # No `version:` pin — see the matching comment in release.yaml.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          args: release --snapshot --clean --skip=sign
