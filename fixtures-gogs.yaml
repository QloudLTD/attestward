# Expected check status per check, per repo, for the live Gogs integration
# test (Gogs issue #9) — the Gogs twin of fixtures.yaml and fixtures-ado.yaml.
#
# Captured from a real scan of gogs.ioakeim.com on 2026-08-03 against
# sioakim/attestward, the repo this project's own source lives in. Unlike the
# GitHub and Azure DevOps fixtures, this table is NOT backed by a purpose-built
# demo org with deliberately good and deliberately bad repos: no such Gogs demo
# estate exists, and building one would mostly demonstrate the same 44
# not-checkable results, since Gogs cannot evidence those controls for any repo.
#
# What this table is therefore good for: catching a change in what the scanner
# claims, and catching a Gogs API change that turns a verified result into an
# error. What it is NOT good for: proving the scanner distinguishes a
# well-configured repo from a badly configured one — on this platform there are
# only two checks where that distinction can even exist.
#
# The two verified-pass entries are the whole of the platform's positive
# evidence: this repo has a SECURITY.md, and that file advertises a URL.
platform: gogs
org: sioakim
repos:
  - attestward

org_checks:
  - check_id: C01.org.2fa-required
    status: not-checkable
  - check_id: C01.org.default-repo-permission
    status: not-checkable
  - check_id: C01.org.members-can-create-public
    status: not-checkable
  - check_id: C01.org.members-without-2fa
    status: not-checkable
  - check_id: C04.org.security-defaults
    status: not-checkable
