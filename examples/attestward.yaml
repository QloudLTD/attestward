# Example attestward scan configuration.
#
# Usage: attestward scan --config attestward.yaml
# Any of these values can be overridden on the command line — e.g.
# `attestward scan --config attestward.yaml --out /tmp/evidence` writes
# somewhere else for one run without editing this file. Flags always win
# over the file, field by field; a flag you don't pass leaves the file's
# value (or attestward's built-in default) untouched.
#
# Unknown keys are a hard error (a typo'd "respos:" silently scanning
# everything instead of the repos you meant would be a truthfulness bug in
# a tool whose whole point is truthful evidence) — so if attestward rejects
# this file after you've edited it, check for a misspelled key first.

# Required. The GitHub account to scan — an Organization or a personal User
# account both work (attestward detects which automatically). Org-scoped
# checks (e.g. C01 org-security, C09 audit-logging) report not-checkable
# with a specific reason for a personal-account target, since GitHub's
# org-level API has no equivalent for one.
org: my-org

# Point the scan at a GitHub Enterprise Server install instead of github.com
# (issue #11's GHES epic) — still --platform github (the default), not a
# separate platform. Accepts either the install's browser-facing URL (as
# below) or an already-API URL ("https://ghe.example.com/api/v3/"), without
# double-appending "/api/v3". Leave commented out (or omit) for github.com —
# every existing setup is unaffected. Falls back to the GITHUB_URL
# environment variable if both this and --github-url are unset; a flag
# always wins over either.
#
# A private/self-signed CA is common on a GHES install — set that via the
# GITHUB_CA_CERT environment variable (no config-file key for it) rather
# than here. See README.md's "GitHub Enterprise Server" section for token-
# scope and network-reachability guidance specific to a GHES scan, and
# docs/checks-reference.md for which checks' GHES behavior is confirmed
# versus honestly unverified.
# github_url: https://ghe.example.com

# The "product line" being attested for. Leave empty (or omit entirely) to
# scan every non-archived, non-fork repo in the account — attestward prints a
# warning when it falls back to this, since scanning "everything" instead
# of an intentional subset is worth knowing about (and, for a personal
# account target, only public repos are listed this way — pass explicit
# repos to include private ones).
repos:
  - my-product-api
  - my-product-web

# Glob/regex matched against tag names to find releases in scope for the
# release-history checks (C05-C07). Default: v*
release_tag_pattern: "v*"

# How far back release-history checks look. Default: last 5 releases or 12
# months, whichever is more data — each collector decides which of the two
# numbers actually bound its query once it has real release dates to work
# with.
lookback_releases: 5
lookback_months: 12

# Path to a self-attestation answers file (see issue #23; generate a
# template with `attestward attest init`). Optional; controls that can't be
# verified via API are reported as not-checkable until this is supplied.
# self_attestation_file: ./self-attestation.yaml

# Where evidence.json (plus its .sha256 sidecar, and .bundle if --sign is
# set) gets written. Default: ./evidence/. report.md/html and poam.md are a
# separate step: `attestward report ./evidence/evidence.json`.
out: ./evidence/

# How many collectors run concurrently. Default: 4
concurrency: 4

# Sign evidence.json with `cosign sign-blob` after writing it (issue #27;
# requires cosign on PATH — see ADR-0006). sign_args is passed through to
# cosign verbatim: leave it empty for keyless signing (Sigstore/Fulcio
# OIDC — the same flow this project's own release pipeline uses), or set
# it to something like ["--key=cosign.key"] for a key file. attestward never
# manages key material itself.
# sign: true
# sign_args: []

# Which platform to scan: github (default), azuredevops, or gogs.
# platform: github

# Azure DevOps project name. Required when platform is azuredevops, and
# rejected otherwise — a project set against a github scan is a mistake this
# tool refuses rather than silently ignores.
# project: my-project

# Base URL of the Gogs instance, e.g. https://gogs.example.com. Required when
# platform is gogs (there is no hosted Gogs service to default to), and
# rejected otherwise. Give the browser-facing root, not the API root — the
# /api/v1 prefix is added for you. A path prefix is fine if the instance is
# served under a suburl. The credential comes from GOGS_TOKEN; a Gogs
# personal access token is the only thing its API accepts, since basic auth
# is rejected even with a correct password.
#
# Read what a Gogs scan can and cannot evidence in the README before relying
# on one: most checks come back not-checkable, because the platform has no
# mechanism behind them.
# gogs_url: https://gogs.example.com
