# Attestward scan — GitLab CI template.
#
# Copy into your own project. This is a TEMPLATE for scanning YOUR repositories;
# it is not the CI for attestward itself.
#
# ⚠ UNVERIFIED SKELETON. No GitLab releases have been published yet, so the
# download URL below resolves to nothing today and the cosign invocation has
# not been run end to end. Treat this as the shape of the job, not a working
# copy-paste, until a release exists and this has been executed once.
#
# ⚠ Pin ATTESTWARD_VERSION to a release that exists, and verify the signature —
# an unpinned or unverified binary defeats the point of an attestation tool.
#
# Required CI/CD variables (Settings → CI/CD → Variables), both masked:
#   ATTESTWARD_TOKEN  read-only token for the platform being scanned
#   (add COSIGN_* only if you verify with a key rather than keyless)

variables:
  ATTESTWARD_VERSION: "v1.0.0"          # pin me

attestward-scan:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl tar cosign
  script:
    - |
      set -euo pipefail
      base="https://gitlab.com/sioakeim/attestward/-/releases/${ATTESTWARD_VERSION}/downloads"
      curl -fsSL -o attestward.tar.gz "${base}/attestward_linux_amd64.tar.gz"
      # Verify before trusting the binary. Keyless verification example:
      # ⚠ Pin BOTH of these to the identity that actually signs your releases.
      # A wildcard here verifies that the artifact was signed by *someone*,
      # which is not a security control — it accepts any signer on the public
      # transparency log. Set them before relying on this job.
      : "${ATTESTWARD_SIGNER_IDENTITY:?set to the signing workflow identity, e.g. https://gitlab.com/<group>/<project>//.gitlab-ci.yml@refs/tags/v1.0.0}"
      : "${ATTESTWARD_SIGNER_ISSUER:?set to the OIDC issuer, e.g. https://gitlab.com}"
      cosign verify-blob-attestation attestward.tar.gz \
        --bundle "${base}/attestward_linux_amd64.tar.gz.bundle" \
        --certificate-identity "${ATTESTWARD_SIGNER_IDENTITY}" \
        --certificate-oidc-issuer "${ATTESTWARD_SIGNER_ISSUER}" || { echo "signature verification FAILED"; exit 1; }
      tar xzf attestward.tar.gz
    - ./attestward scan --format md --out evidence/
  artifacts:
    when: always
    paths:
      - evidence/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG          # scan per release
    - if: $CI_PIPELINE_SOURCE == "schedule"
