name: Semgrep SAST
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "42 5 * * 2"
  workflow_dispatch: {}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and run Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==1.171.0"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config p/golang --metrics=off --error
