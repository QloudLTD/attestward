# mappings/scanner-signatures.yaml
#
# Detection signatures for SAST/SCA/container/secrets/SBOM/provenance
# scanning and signing tools, as they appear in GitHub Actions workflow
# files and (since #149) Azure Pipelines YAML — action `uses:` slugs / ADO
# `task:` references, `run:` / `script:`-`bash:`-`pwsh:`-`powershell:` step
# CLI invocations, and (last resort) workflow/pipeline `name:` heuristics.
# Used by C05 (SAST), C06 (SCA), and C07 (provenance) to fingerprint which
# tools a repo actually runs and how often. Data, not code (ADR-0003):
# adding a new scanner is a YAML contribution, not a Go change — see
# CONTRIBUTING.md's "New scanner signature" section.
#
# Unlike ssdf-800-218.yaml/cisa-ssda-form.yaml, this file isn't a citable
# transcription of a regulatory source — CLAUDE.md's "never invent SSDF task
# IDs, CISA form language, or regulatory citations" rule doesn't apply to it.
# Action slugs, ADO task names, and CLI patterns below are still meant to be
# accurate, not invented; each is exercised by a fixture workflow under
# internal/mapping/testdata/workflows/ (or, for ADO, a fixture pipeline
# under internal/mapping/testdata/pipelines/) that the loader's tests
# assert actually matches (and that no other signature in this file also
# matches).
#
# `detect` lists any-of matchers, in confidence order — the matcher
# (internal/mapping's MatchWorkflow for GitHub Actions, MatchPipeline for
# Azure Pipelines) tries `actions`/`ado_tasks` first (confidence: high, an
# action `uses:` slug or an ADO `task:` reference is a strong, hard-to-fake
# signal), then `run_patterns` (confidence: medium, a regex over CLI
# invocation text — a real CLI invocation, but could in principle appear in
# an unrelated comment or string), then `workflow_name_patterns`
# (confidence: low, a regex over the workflow/pipeline's own `name:` field —
# a naming convention, not actual tool usage). Confidence is a property of
# *which* matcher fired, not a static field on the signature itself.
#
# `run_patterns` and `workflow_name_patterns` are cross-platform despite
# their GitHub-flavored names (kept as-is rather than renamed, for backward
# compatibility): on GitHub Actions they match a step's `run:` text and the
# workflow's own `name:`; on Azure Pipelines they match a step's
# `script:`/`bash:`/`pwsh:`/`powershell:` text and the pipeline's own
# `name:` field, plus each step's own `displayName:`. `ado_tasks` has no
# GitHub equivalent: an ADO pipeline `task:` reference is written
# `TaskName@Version` (e.g. `AdvancedSecurity-Codeql-Init@1`, or a full
# version pin like `GoTool@0.3.1` — a form Microsoft's own docs use);
# `task` matches the exact, full string before the last `@`,
# case-insensitively — no dot-segment splitting, so a fully-qualified
# marketplace reference — four segments,
# `publisher.extensionId.contributionId.taskName@version` (e.g.
# `qetza.replacetokens.replacetokens-task.replacetokens@3`), not three —
# or a bare task GUID does NOT cross-match a matcher written against a
# short task name (two different publishers can share a bare task name, so
# collapsing either form down to "the part that looks like the short
# name" could cross-match the wrong tool — a signature that genuinely
# needs to recognize the fully-qualified or GUID form lists that exact
# string as its own `ado_tasks` entry instead); `major` is an optional
# exact-match pin against only the segment of the post-`@` version before
# its first `.` (empty matches any version; `major: "1"` matches both
# `@1` and `@1.2.3`) — this is `actions`' Slug+Version pair, reimplemented
# for ADO's own task-versioning scheme rather than reused, since an action
# slug and an ADO task name are different namespaces. #149 added the
# `ado_tasks` field and the MatchPipeline matcher (schema+matcher PR), then
# the first per-signature `ado_tasks` entries (registry PR): `codeql`
# (GitHub Advanced Security for Azure DevOps' AdvancedSecurity-Codeql-Init/
# AdvancedSecurity-Codeql-Analyze — same CodeQL engine as the GitHub-native
# entry, hence reusing this signature's id rather than a separate one),
# `snyk` (SnykSecurityScan), and `sonarqube` (SonarQubePrepare/
# SonarQubeAnalyze — SonarQube Server only; SonarCloud's ADO extension uses
# entirely different task names, SonarCloudPrepare/SonarCloudAnalyze, not
# yet added), plus a new `ghazdo-dependency-scanning` entry for GHAzDO's
# Dependency Scanning task (AdvancedSecurity-Dependency-Scanning), which has
# no existing GitHub-side signature to extend. Every task name above was
# verified against Microsoft/vendor documentation, not guessed — see each
# entry's own comment for the source and the major-version-pinning
# rationale (a bare, current major for Microsoft's own fast-moving GHAzDO
# tasks and Snyk's long-stable one; left unpinned for SonarQube, whose ADO
# extension has shipped several concurrently-supported majors).
#
# `template:` references in an Azure Pipelines file — a step, job, or
# stage that points at another YAML file instead of containing its
# content directly, or the pipeline's own root-level `extends:` (the
# standard mandated-template pattern, e.g. `extends: {template:
# v1/pipeline.yml@templates}`, where the entire pipeline body lives in
# another file) — are outside what MatchPipeline can see: it does no I/O
# and cannot fetch the referenced file, so every one of these is surfaced
# to callers as unresolved rather than silently treated as "not present".
# One gap this does NOT yet cover: a deployment job's steps (`-
# deployment: <name>`, nested under strategy.runOnce/canary/rolling rather
# than a plain `steps:` list) aren't traversed at all — not even flagged
# as unresolved, since a deployment job has no `template:` field to detect
# it by. See MatchPipeline's own doc comment in internal/mapping for the
# same caveat; traversal support is deferred to a follow-up.
#
# dependabot is special-cased: unlike every other entry here, Dependabot
# isn't invoked from a workflow at all — it's detected by the *presence* of
# a `.github/dependabot.yml` config file, which this file's workflow-content
# matcher structurally cannot express (`detect` is deliberately empty).
# Real detection for it lands with #18 (C06 sca-history), which can check
# for that file directly via the GitHub API; it's listed here now purely
# for SCA-category registry completeness.

version: "1.2.0"

signatures:
  - id: codeql
    name: "GitHub CodeQL"
    category: sast
    detect:
      actions:
        - slug: github/codeql-action/analyze
      # GitHub Advanced Security for Azure DevOps (GHAzDO) runs the same
      # CodeQL engine via a two-task pipeline sequence rather than a GitHub
      # Actions step — verified against Microsoft Learn's own task
      # reference pages (advanced-security-codeql-init-v1,
      # advanced-security-codeql-analyze-v1): both tasks are currently only
      # published at major version 1, so that's pinned rather than left
      # open, unlike sonarqube's ado_tasks below.
      ado_tasks:
        - task: AdvancedSecurity-Codeql-Init
          major: "1"
        - task: AdvancedSecurity-Codeql-Analyze
          major: "1"
      run_patterns: []
      workflow_name_patterns:
        - "(?i)\\bcodeql\\b"
    run_evidence: >-
      Each CodeQL run is a workflow run of the workflow containing the
      github/codeql-action/analyze step; the analyze step's own run also
      appears as a check run (typically named "CodeQL") on the commit/PR it
      scanned. On Azure Pipelines (GHAzDO), a run is a pipeline run whose
      steps include AdvancedSecurity-Codeql-Init followed by
      AdvancedSecurity-Codeql-Analyze; results surface on the repo's
      Advanced Security tab in Azure DevOps, not as a GitHub check run.

  - id: semgrep
    name: "Semgrep"
    category: sast
    detect:
      actions:
        # returntocorp/semgrep-action is the pre-2024 slug (org since
        # renamed to semgrep/, and the old repo archived as a fork) — both
        # kept since older workflows may still reference the original.
        - slug: returntocorp/semgrep-action
        - slug: semgrep/semgrep-action
      run_patterns:
        - "\\bsemgrep\\b"
      workflow_name_patterns:
        - "(?i)\\bsemgrep\\b"
    run_evidence: >-
      Workflow run of the job invoking either the semgrep-action or the
      semgrep CLI directly; Semgrep's own GitHub integration (if configured)
      additionally posts a check run.

  - id: sonarqube
    name: "SonarQube / SonarCloud"
    category: sast
    detect:
      actions:
        - slug: SonarSource/sonarqube-scan-action
        # Legacy SonarCloud-specific action — archived but still widely
        # referenced by existing workflows.
        - slug: SonarSource/sonarcloud-github-action
      # SonarQube Server's Azure Pipelines extension only — verified
      # against Microsoft Learn's task reference (sonar-qube-prepare-v7,
      # sonar-qube-analyze-v7). Major deliberately left unpinned: unlike
      # codeql/snyk above, this extension has shipped several majors
      # (at least v5-v7) that remain in concurrent real-world use, so
      # pinning one would make this entry go stale rather than more
      # accurate. SonarCloud's own Azure Pipelines extension uses entirely
      # different task names (SonarCloudPrepare/SonarCloudAnalyze, not
      # SonarQube*) and isn't covered by this entry yet.
      ado_tasks:
        - task: SonarQubePrepare
        - task: SonarQubeAnalyze
      run_patterns:
        - "\\bsonar-scanner\\b"
      workflow_name_patterns: []
    run_evidence: >-
      Workflow run of the job invoking the scan action or sonar-scanner
      CLI; SonarCloud/SonarQube separately posts its own quality-gate
      status check on the commit. On Azure Pipelines, a run is a pipeline
      run invoking SonarQubePrepare followed by SonarQubeAnalyze; the
      quality-gate status still posts to the SonarQube server itself,
      independent of the pipeline run's own status.

  - id: dependency-review-action
    name: "GitHub Dependency Review"
    category: sca
    detect:
      actions:
        - slug: actions/dependency-review-action
      run_patterns: []
      workflow_name_patterns: []
    run_evidence: >-
      Runs only on pull requests (it diffs the PR's dependency changes);
      surfaces as a check run on the PR, not on ordinary pushes.

  - id: ghazdo-dependency-scanning
    name: "GitHub Advanced Security for Azure DevOps Dependency Scanning"
    category: sca
    detect:
      actions: []
      # Verified against Microsoft Learn's task reference
      # (advanced-security-dependency-scanning-v1): currently only
      # published at major version 1. No GitHub-side signature to extend
      # here (unlike codeql/snyk/sonarqube below) — this is a
      # GHAzDO-specific mechanism with no equivalent GitHub Actions tool by
      # the same name; dependency-review-action and dependabot above are
      # conceptually related but are different, unrelated tools.
      ado_tasks:
        - task: AdvancedSecurity-Dependency-Scanning
          major: "1"
      run_patterns: []
      workflow_name_patterns: []
    run_evidence: >-
      Pipeline run whose steps include AdvancedSecurity-Dependency-Scanning;
      results surface on the repo's Advanced Security tab in Azure DevOps.

  - id: snyk
    name: "Snyk"
    category: sca
    detect:
      actions:
        # Snyk ships one action per language/ecosystem rather than one
        # canonical slug — enumerating the common ones here (ActionMatcher
        # is exact-slug, no prefix support) rather than relying solely on
        # the run_patterns fallback below, which misses action-only usage
        # with no separate CLI invocation.
        - slug: snyk/actions/node
        - slug: snyk/actions/python
        - slug: snyk/actions/golang
        - slug: snyk/actions/docker
        - slug: snyk/actions/maven
        - slug: snyk/actions/gradle
      # Verified against Snyk's own Azure Pipelines integration docs and
      # the "Snyk Security Scan" marketplace listing (Snyk.snyk-security-scan):
      # the task has been SnykSecurityScan@1 since it shipped, with no
      # newer major found, so major is pinned rather than left open.
      ado_tasks:
        - task: SnykSecurityScan
          major: "1"
      run_patterns:
        - "snyk (test|monitor)"
      workflow_name_patterns:
        - "(?i)\\bsnyk\\b"
    run_evidence: >-
      Workflow run of the job invoking a snyk/actions/* action or the snyk
      CLI directly. On Azure Pipelines, a run is a pipeline run invoking the
      SnykSecurityScan task.

  - id: trivy
    name: "Trivy"
    category: sca
    detect:
      actions:
        - slug: aquasecurity/trivy-action
      run_patterns:
        - "trivy (fs|repo|image)"
      workflow_name_patterns: []
    run_evidence: "Workflow run of the job invoking the trivy-action or trivy CLI."

  - id: grype
    name: "Grype"
    category: sca
    detect:
      actions:
        - slug: anchore/scan-action
      run_patterns:
        - "\\bgrype\\b"
      workflow_name_patterns: []
    run_evidence: "Workflow run of the job invoking anchore/scan-action (which wraps Grype) or the grype CLI directly."

  - id: osv-scanner
    name: "OSV-Scanner"
    category: sca
    detect:
      actions:
        - slug: google/osv-scanner-action
        # OSV-Scanner's officially recommended integration is a job-level
        # *reusable workflow* call (jobs.<id>.uses:), not a step — the
        # dominant real-world usage, distinct from the plain action slug
        # above. See WorkflowJob.Uses' doc comment for how the matcher
        # checks both the same way.
        - slug: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml
      run_patterns:
        - "osv-scanner\\b"
      workflow_name_patterns: []
    run_evidence: "Workflow run of the job invoking the osv-scanner-action, its reusable workflow, or the osv-scanner CLI."

  - id: dependabot
    name: "Dependabot"
    category: sca
    detect:
      actions: []
      run_patterns: []
      workflow_name_patterns: []
    run_evidence: >-
      Not workflow-invoked at all — detected by the presence of
      .github/dependabot.yml, not by anything expressible in this file's
      detect schema. See this file's header comment. #18 implements real
      detection; this entry is registry-only for now, deliberately excluded
      from the cross-matrix "every signature matches its own fixture" test.

  - id: cosign
    name: "Sigstore cosign"
    category: provenance
    detect:
      actions:
        - slug: sigstore/cosign-installer
      run_patterns:
        # The installer action only puts the cosign binary on PATH — the
        # actual signing happens in a separate run: step, e.g. `cosign
        # sign-blob --bundle=...`. Matched as a fallback for the rarer case
        # of a preinstalled cosign binary invoked with no installer action
        # present at all.
        - "\\bcosign (sign|sign-blob|attest)\\b"
      workflow_name_patterns: []
    run_evidence: >-
      Workflow run of the job invoking sigstore/cosign-installer followed
      by a cosign sign/sign-blob/attest step; produces a Sigstore bundle
      (keyless, Fulcio/Rekor-backed) alongside the signed artifact.

  - id: slsa-generator
    name: "SLSA GitHub Generator"
    category: provenance
    detect:
      actions:
        # slsa-github-generator is invoked as a job-level *reusable
        # workflow* call (jobs.<id>.uses:), the same mechanism as
        # osv-scanner's dominant real-world usage — see WorkflowJob.Uses'
        # doc comment. Two of the generator's several artifact-type
        # variants are listed; not exhaustive (ActionMatcher is exact-slug,
        # no wildcard support), same practical scoping as C06's ecosystem
        # table.
        - slug: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
        - slug: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml
      run_patterns: []
      workflow_name_patterns:
        - "(?i)\\bslsa\\b"
    run_evidence: >-
      Workflow run of the job calling one of slsa-github-generator's
      reusable workflows; produces a SLSA provenance attestation uploaded
      as a release/workflow artifact.

  - id: attest-build-provenance
    name: "GitHub Artifact Attestations (attest-build-provenance)"
    category: provenance
    detect:
      actions:
        - slug: actions/attest-build-provenance
      run_patterns: []
      workflow_name_patterns: []
    run_evidence: >-
      Workflow run of the job invoking actions/attest-build-provenance;
      produces a GitHub-hosted attestation retrievable via
      GET /repos/{owner}/{repo}/attestations/{subject_digest}.
